name: Fetch images from WordPress
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/image-urls.txt']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/fetch-images.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A wp-content tools/missing.txt
          git diff --cached --quiet || git commit -m "Add images copied from WordPress"
          git push
